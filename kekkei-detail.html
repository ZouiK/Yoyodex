    <link rel="apple-touch-icon" href="img/solve logo.png">
    <title>Nom du Kekkei Genkai – Fiche RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-brand" id="navBrand">

                    <p id="info3">—</p>
                </div>
                <div class="info-block placeholder">
                    <h2>Info 4</h2>

                <div class="info-block placeholder">

                <div class="info-block placeholder">

                    <img id="portraitImg" src="https://via.placeholder.com/400x600/444/ffffff?text=Kekkei+Genkai" alt="Illustration" class="portrait">

                <div class="emblem-container">

            <p id="descriptionText">Description...</p>
        </section>

    <script src="kekkei-detail.js?v=2"></script>
    <script>
        const navBrand = document.getElementById('navBrand');
        if (navBrand) {
            navBrand.addEventListener('click', function() {
                window.location.href = 'index.html?tab=kekkei';
            });
        }
